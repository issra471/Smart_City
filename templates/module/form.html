{% extends "base.html" %}
{% block title %}{{ title }} · Smart City{% endblock %}
{% block content %}
<div class="portal">
  {% include "includes/citizen_sidebar.html" %}
  <div class="portal-main">
<main class="content">
  <div class="page-title">
    <div>
      <p class="eyebrow">Services citoyens</p>
      <h1>{{ title }}</h1>
    </div>
  </div>
  <form method="post" enctype="multipart/form-data" class="panel profile-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}
        {{ field }}
        {{ field.help_text }}
        {{ field.errors }}
      </label>
    {% endfor %}
    <div class="form-actions">
      <a href="{% url list_url %}" class="button secondary">Annuler</a>
      <button type="submit" class="button">Enregistrer <span aria-hidden="true">→</span></button>
    </div>
  </form>
</main>
</div>
</div>
{% endblock %}
