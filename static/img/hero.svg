<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebe3"/><stop offset="1" stop-color="#f7f1e1"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb7a6"/><stop offset="1" stop-color="#a9d3c4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#sky)"/>
  <circle cx="500" cy="100" r="46" fill="#f3c98b" opacity=".9"/>
  <path d="M0 250 Q120 170 240 235 T480 220 T640 245 V330 H0Z" fill="#b9d8c7"/>
  <path d="M0 280 Q160 220 320 275 T640 270 V340 H0Z" fill="#8fc0a8"/>

  <!-- buildings -->
  <g>
    <rect x="40"  y="205" width="90" height="135" fill="#efe0c8"/><path d="M34 205 L85 165 L136 205Z" fill="#c9734a"/>
    <rect x="140" y="230" width="70" height="110" fill="#e4c39a"/><path d="M134 230 L175 198 L216 230Z" fill="#a85a3a"/>
    <rect x="222" y="190" width="80" height="150" fill="#f4ead8"/><path d="M216 190 L262 150 L308 190Z" fill="#d38a55"/>
    <rect x="312" y="225" width="75" height="115" fill="#e9cfa6"/><path d="M306 225 L350 192 L394 225Z" fill="#b96a43"/>
    <g fill="#5c8a7a" opacity=".85">
      <rect x="58" y="225" width="16" height="22"/><rect x="92" y="225" width="16" height="22"/>
      <rect x="58" y="268" width="16" height="22"/><rect x="92" y="268" width="16" height="22"/>
      <rect x="156" y="250" width="14" height="20"/><rect x="180" y="250" width="14" height="20"/>
      <rect x="240" y="210" width="16" height="22"/><rect x="268" y="210" width="16" height="22"/>
      <rect x="240" y="254" width="16" height="22"/><rect x="268" y="254" width="16" height="22"/>
      <rect x="328" y="245" width="14" height="20"/><rect x="354" y="245" width="14" height="20"/>
    </g>
  </g>

  <!-- river -->
  <path d="M0 345 Q160 330 320 345 T640 340 V385 Q480 395 320 385 T0 392Z" fill="url(#river)"/>
  <path d="M60 362 h60 M240 368 h70 M430 360 h60" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>

  <!-- road + bike lane -->
  <rect y="392" width="640" height="88" fill="#35574b"/>
  <rect y="392" width="640" height="10" fill="#2a463c"/>
  <path d="M0 440 H640" stroke="#f4ead8" stroke-width="4" stroke-dasharray="30 22"/>
  <rect y="455" width="640" height="25" fill="#2f7a5f" opacity=".55"/>

  <!-- trees -->
  <g>
    <rect x="410" y="285" width="8" height="70" fill="#7a5a3f"/><circle cx="414" cy="272" r="38" fill="#e0a040"/><circle cx="436" cy="290" r="26" fill="#c96a2b"/>
    <rect x="520" y="270" width="9" height="85" fill="#7a5a3f"/><circle cx="525" cy="250" r="44" fill="#d98a35"/><circle cx="498" cy="276" r="28" fill="#e3b04f"/>
    <rect x="592" y="300" width="7" height="55" fill="#7a5a3f"/><circle cx="596" cy="288" r="30" fill="#2f7a5f"/>
    <rect x="14" y="300" width="7" height="55" fill="#7a5a3f"/><circle cx="18" cy="290" r="28" fill="#3b8c6c"/>
  </g>

  <!-- electric bus -->
  <g transform="translate(70 395)">
    <rect width="190" height="62" rx="12" fill="#1f5c4a"/>
    <rect x="10" y="10" width="34" height="22" rx="4" fill="#dcebe3"/><rect x="50" y="10" width="34" height="22" rx="4" fill="#dcebe3"/>
    <rect x="90" y="10" width="34" height="22" rx="4" fill="#dcebe3"/><rect x="130" y="10" width="46" height="30" rx="4" fill="#dcebe3"/>
    <rect x="0" y="40" width="190" height="6" fill="#f3c98b"/>
    <path d="M96 48 l-8 12 h7 l-3 10 12-15 h-7 l4-7z" fill="#f3c98b"/>
    <circle cx="40" cy="62" r="13" fill="#14302a"/><circle cx="40" cy="62" r="5" fill="#cfd9d4"/>
    <circle cx="150" cy="62" r="13" fill="#14302a"/><circle cx="150" cy="62" r="5" fill="#cfd9d4"/>
  </g>

  <!-- cyclist -->
  <g transform="translate(360 405)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="50" r="22" fill="none" stroke="#14302a" stroke-width="4"/>
    <circle cx="100" cy="50" r="22" fill="none" stroke="#14302a" stroke-width="4"/>
    <path d="M20 50 L52 50 L74 18 L96 18 M52 50 L74 18 M52 50 L100 50 L88 18" fill="none" stroke="#c9734a" stroke-width="4"/>
    <path d="M70 14 L84 14" stroke="#14302a" stroke-width="5"/>
    <path d="M60 14 L52 -18" stroke="#1f5c4a" stroke-width="10"/>
    <path d="M56 -12 L84 4 L92 18" fill="none" stroke="#1f5c4a" stroke-width="7"/>
    <path d="M54 12 L70 36 L66 52" fill="none" stroke="#14302a" stroke-width="6"/>
    <circle cx="50" cy="-34" r="11" fill="#f0c9a0"/>
    <path d="M39 -38 a12 12 0 0 1 24 0z" fill="#f3c98b"/>
  </g>

  <!-- charging post -->
  <g transform="translate(300 395)">
    <rect width="22" height="46" rx="5" fill="#f4ead8" stroke="#1f5c4a" stroke-width="3"/>
    <path d="M12 10 l-6 12 h6 l-3 10 8-14 h-6 l3-8z" fill="#2f7a5f"/>
  </g>
</svg>
